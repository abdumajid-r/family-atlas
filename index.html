const byId=new Map(),parents=new Map();
function walk(node,parent=null){byId.set(node.id,node);parents.set(node.id,parent);node.children.forEach(c=>walk(c,node))}DATA.roots.forEach(r=>walk(r));
const branchIds=new Set(DATA.branches.map(b=>b.id));
const people=[...byId.values()].filter(n=>!n.gap),leaves=people.filter(n=>!n.children.length);
const biographies=people.filter(n=>n.biography);
document.getElementById('personCount').textContent=`${byId.size} боғланган ёзув`;
document.getElementById('leafCount').textContent=`${leaves.length} сўнгги авлод`;
document.getElementById('bioCount').textContent=`${biographies.length} манбали таржимаи ҳол`;
const branchColors=['#315b72','#7b5d2d','#285e51','#7a4b3f','#5c4f7c','#3f6b57'];
let current=DATA.roots[0],mode='nav',query='';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const regexEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm=s=>s.toLocaleLowerCase('uz-Cyrl').replace(/ё/g,'е').replace(/ў/g,'у').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ҳ/g,'х');
const nameOf=n=>n.display_name||n.label;
const ancestry=n=>{const out=[];while(n){out.unshift(n);n=parents.get(n.id)}return out};
function renderBio(n){const b=n.biography;if(!b)return '';return `<section class="bio" aria-label="Қисқача таржимаи ҳол"><div class="bio-facts"><div class="bio-fact"><strong>Йиллар:</strong> ${esc(b.years)}</div><div class="bio-fact"><strong>Яшаган жойлари:</strong> ${esc(b.places)}</div></div><p>${esc(b.bio)}</p><div class="sources" aria-label="Манбалар">${b.sources.map((s,i)=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Манба ${i+1}: ${esc(s.title)}</a>`).join('')}</div></section>`}
function branchOf(n){const path=ancestry(n);return path.find(x=>branchIds.has(x.id))||null}
function renderBranches(){const active=branchOf(current)?.id;const el=document.getElementById('branches');el.innerHTML=DATA.branches.map((b,i)=>`<button class="chip ${active===b.id?'active':''}" data-id="${b.id}" style="--branch:${branchColors[i]}">${esc(b.label)}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function select(id){current=byId.get(id);renderBranches();renderNavigator();if(mode==='tree'){mode='nav';setMode()}window.scrollTo({top:document.querySelector('.branches').offsetTop-88,behavior:'smooth'})}
function renderNavigator(){const nav=document.getElementById('navigator'),parent=parents.get(current.id),path=ancestry(current),siblings=parent?parent.children.filter(n=>n!==current&&!n.gap):[];nav.innerHTML=`<div class="path">${path.map(n=>`<button data-id="${n.id}">${esc(n.gap?'…':nameOf(n))}</button>`).join('')}</div><article class="card"><div class="meta">${current.gap?'Аниқланмаган бўғин':`Авлод даражаси: ${path.filter(n=>!n.gap).length}`}</div><h2 class="person-name">${esc(nameOf(current).replace(/^\[|\]$/g,''))}</h2>${renderBio(current)}${current.children.length?`<div class="section-title">Фарзандлари · ${current.children.length}</div><div class="people">${current.children.map(n=>`<button class="person-btn" data-id="${n.id}"><span>${esc(n.gap?'Аниқланмаган бўғин(лар)':nameOf(n))}${n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':''}</span><span>›</span></button>`).join('')}</div>`:'<div class="empty-state">Манбада фарзандлар кўрсатилмаган.</div>'}${siblings.length?`<div class="section-title">Ака-ука ва опа-сингиллари</div><div class="people">${siblings.map(n=>`<button class="person-btn" data-id="${n.id}"><span>${esc(nameOf(n))}${n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':''}</span><span>›</span></button>`).join('')}</div>`:''}<div class="nav-actions">${parent?`<button class="btn secondary" data-id="${parent.id}">← Ота-онасига чиқиш</button>`:''}<button class="btn secondary" data-id="${DATA.roots[0].id}">Бошига қайтиш</button></div></article>`;nav.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>select(x.dataset.id))}
function renderTree(){const root=document.getElementById('tree');function item(n,depth=0){const has=n.children.length;return `<li class="node ${n.gap?'gap ':''}${branchIds.has(n.id)?'branch ':''}" data-id="${n.id}"><div class="node-row"><button class="toggle ${has?'':'empty'}" ${has?'':'disabled'} aria-label="${has?'Тармоқни очиш ёки ёпиш':''}">${has?'−':'·'}</button><button class="node-name">${esc(nameOf(n).replace(/^\[|\]$/g,''))}${n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':''}</button></div>${has?`<ul>${n.children.map(c=>item(c,depth+1)).join('')}</ul>`:''}</li>`}root.innerHTML=`<ul>${DATA.roots.map(r=>item(r)).join('')}</ul>`;root.querySelectorAll('.toggle:not(.empty)').forEach(btn=>btn.onclick=()=>{const li=btn.closest('.node');li.classList.toggle('collapsed');btn.textContent=li.classList.contains('collapsed')?'+':'−'});root.querySelectorAll('.node-name').forEach(btn=>btn.onclick=()=>select(btn.closest('.node').dataset.id))}
function setMode(){const nav=mode==='nav';document.getElementById('navigator').hidden=!nav;document.getElementById('hierarchy').hidden=nav;document.getElementById('navMode').setAttribute('aria-pressed',String(nav));document.getElementById('treeMode').setAttribute('aria-pressed',String(!nav));if(!nav&&!document.getElementById('tree').children.length)renderTree()}
document.getElementById('navMode').onclick=()=>{mode='nav';setMode()};document.getElementById('treeMode').onclick=()=>{mode='tree';setMode()};
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.node').forEach(li=>{li.classList.remove('collapsed');const b=li.querySelector(':scope>.node-row>.toggle');if(b&&!b.classList.contains('empty'))b.textContent='−'});
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.node').forEach((li,i)=>{if(i){li.classList.add('collapsed');const b=li.querySelector(':scope>.node-row>.toggle');if(b&&!b.classList.contains('empty'))b.textContent='+'}});
function searchable(n){return [n.label,nameOf(n),n.biography?.bio,n.biography?.years,n.biography?.places].filter(Boolean).join(' ')}
function searchTree(value){query=value.trim();const clear=document.getElementById('clearSearch');clear.hidden=!query;if(!query)return;mode='tree';setMode();const q=norm(query),nodes=[...document.querySelectorAll('.node')];nodes.forEach(li=>li.classList.remove('hidden-by-search'));let matches=0;nodes.forEach(li=>{const n=byId.get(li.dataset.id),self=norm(searchable(n)).includes(q),desc=[...li.querySelectorAll(':scope .node')].some(x=>norm(searchable(byId.get(x.dataset.id))).includes(q));if(!self&&!desc)li.classList.add('hidden-by-search');if(self){matches++;li.querySelector('.node-name').innerHTML=esc(nameOf(n)).replace(new RegExp(regexEsc(esc(query)),'ig'),m=>`<mark>${m}</mark>`)+(n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':'');ancestry(n).forEach(a=>{const x=document.querySelector(`.node[data-id="${a.id}"]`);x?.classList.remove('collapsed');const b=x?.querySelector(':scope>.node-row>.toggle');if(b&&!b.classList.contains('empty'))b.textContent='−'})}});if(!matches)document.getElementById('tree').insertAdjacentHTML('afterbegin','<div class="empty-state" id="noResults">Мос исм ёки маълумот топилмади.</div>')}
document.getElementById('search').oninput=e=>{document.getElementById('noResults')?.remove();if(!e.target.value){query='';document.getElementById('clearSearch').hidden=true;if(document.getElementById('tree').children.length)renderTree();return}if(!document.getElementById('tree').children.length)renderTree();else renderTree();searchTree(e.target.value)};
document.getElementById('clearSearch').onclick=()=>{const s=document.getElementById('search');s.value='';s.dispatchEvent(new Event('input'))};
renderBranches();renderNavigator();
</script>
</body></html>
