<style>

*{box-sizing:border-box}

.hero-frame{max-width:924px;margin:auto;border:1px solid #c6902fbb;border-radius:16px;padding:12px 14px;position:relative;background:linear-gradient(145deg,#06463d,#073a34)}

<body>
<main class="app">

</main>

"Марғилон, Калтатойи маҳалласи билан боғланади","evidence":"Маҳаллий ахборотчилар ва авлодлар хотираси; идентификация қатъий эмас","bio":"Мирсаййид Сафо Аҳмад Эшон раҳматуллоҳи алайҳни китобдаги айрим маҳаллий ахборотчилар Калтатойи Эшон билан бир шахс деб ҳисоблайдилар. Калтатойи зиёратгоҳи яқинида мадраса ва масжид бўлгани, кейин улар шўро даврида вайрон этилгани баён қилинади. Муаллифлар бу исмга доир бошқа тахминлар ҳам борлигини айтганлари учун атлас мазкур идентификацияни қатъий ҳақиқат сифатида эмас, маҳаллий хотира сифатида кўрсатади.","sources":[{"title":"Н. Абдулаҳатов, С. Аброров, А. Тошқулов — «Сармозор зиёратгоҳи», 137–138-бетлар (BAYOZ, 2014)","url":"https://www.ziyouz.com/books/tarixiy/Nodirbek%20Abdulahatov%20va%20b.%20Sarmozor%20ziyoratgohi.pdf"}]}}],"gap":false,"parent":"p27","branch":"main","display_name":"Мир Нажмиддин Эшон раҳматуллоҳи алайҳ","biography":{"years":"XVIII асрнинг иккинчи ярми — тахм. 1870","places":"Марғилонда туғилган; Сармозорда яшаб, шу ерда дафн этилган","evidence":"Китобдаги оилавий тарих ва Қўқон хонлиги ҳужжатларининг қиёсий талқини","bio":"Мир Нажмиддин Эшон раҳматуллоҳи алайҳ Хожа Мир Абдураҳим Эшон раҳматуллоҳи алайҳнинг ўғиллари. Ёшликларидан диний илм ва ҳунар ўрганганлар, кейин умрларини олти ўғилларини тарбиялаш ва уларга илм беришга бағишлаганлар. Китоб у зотни вақф ҳужжатларидаги «Мулла Охунд Бобо Махдум» каби ҳурмат унвонлари билан қиёслайди; бу идентификация китоб муаллифларининг талқинидир.","sources":[{"title":"Н. Абдулаҳатов, С. Аброров, А. Тошқулов — «Сармозор зиёратгоҳи», 123–125-бетлар (BAYOZ, 2014)","url":"https://www.ziyouz.com/books/tarixiy/Nodirbek%20Abdulahatov%20va%20b.%20Sarmozor%20ziyoratgohi.pdf"}]}}],"gap":false,"parent":"p26","branch":"main","display_name":"Хожа Мир Абдураҳим Эшон (Сармозор бува) раҳматуллоҳи алайҳ","biography":{"years":"Аниқ йиллар келтирилмаган; Қўқон хонлиги даврида фаол бўлганлар","places":"Марғилоннинг Зардармуш маҳалласи, Сармозор ва Бўтақора","evidence":"Китобда келтирилган архив ҳужжатлари, вақфнома ва маҳаллий тарихий хотиралар","bio":"Хожа Мир Абдураҳим Эшон (Сармозор бува) раҳматуллоҳи алайҳ Марғилондаги ҳовлиларини Хонақоҳ масжиди учун ҳадя қилиб, қурилишда бош-қош бўлганлар. Китобдаги Қўқон хонлиги ҳужжатларига кўра, Сўх ва Андижон томонларида сув чиқариш ишларига ҳисса қўшганлар, Бўтақорада ер ўзлаштириб тегирмон қурдирганлар; у зотнинг хонақоҳи ва мозорига тегишли вақфлар ҳам қайд этилган.","sources":[{"title":"Н. Абдулаҳатов, С. Аброров, А. Тошқулов — «Сармозор зиёратгоҳи», 64–69 ва 122-бетлар (BAYOZ, 2014)","url":"https://www.ziyouz.com/books/tarixiy/Nodirbek%20Abdulahatov%20va%20b.%20Sarmozor%20ziyoratgohi.pdf"}]}}],"gap":false,"parent":"p25","branch":"main","display_name":"Хожа Мир Азим раҳматуллоҳи алайҳ","biography":{"years":"Аниқ йиллар келтирилмаган","places":"Марғилон, қадимий Зардармуш маҳалласи","evidence":"Китобдаги маҳаллий тарихий баён; аввалги бўғинлар тўлиқ эмас","bio":"Хожа Мир Азим раҳматуллоҳи алайҳ китобда Марғилоннинг қадимий Зардармуш маҳалласида яшаган силсила вакили ва Хожа Мир Абдураҳим Эшон раҳматуллоҳи алайҳнинг оталари сифатида қайд этилганлар. Хожа Шарифдан у зотгача бўлган боғланишда етишмайдиган бўғинлар борлиги сабабли атлас бу жойда қатъийлик даъво қилмайди.","sources":[{"title":"Н. Абдулаҳатов, С. Аброров, А. Тошқулов — «Сармозор зиёратгоҳи», 65 ва 122-бетлар (BAYOZ, 2014)","url":"https://www.ziyouz.com/books/tarixiy/Nodirbek%20Abdulahatov%20va%20b.%20Sarmozor%20ziyoratgohi.pdf"}]}}],"gap":true,"parent":"p24","branch":"main","display_name":"[АНИҚЛАНМАГАН БЎҒИН(ЛАР): Хожа Шариф раҳматуллоҳи алайҳ → Хожа Мир Азим раҳматуллоҳи алайҳ]"}],"gap":false,"parent":"p23","branch":"main","display_name":"Хожа Шариф раҳматуллоҳи алайҳ","biography":{"years":"Аниқ йиллар келтирилмаган","places":"Марғилон, қадимий Зардармуш маҳалласи","evidence":"Китобдаги маҳаллий насабнома ва тарихий баён","bio":"Хожа Шариф раҳматуллоҳи алайҳ маҳаллий насабномада Хожа Тоҳир раҳматуллоҳи алайҳнинг ўғиллари сифатида келтирилади. Китоб у зот ва кейинги силсила вакилларини Марғилоннинг Зардармуш маҳалласи билан боғлайди; Хожа Мир Азимгача бўлган оралиқ бўғинлар эса атласда очиқ қолдирилган.","sources":[{"title":"Н. Абдулаҳатов, С. Аброров, А. Тошқулов — «Сармозор зиёратгоҳи», 103–104 ва 122-бетлар (BAYOZ, 2014)","url":"https://www.ziyouz.com/books/tarixiy/Nodirbek%20Abdulahatov%20va%20b.%20Sarmozor%20ziyoratgohi.pdf"}]}}],"gap":false,"parent":"p22","branch":"main","display_name":"Хожа Тоҳир раҳматуллоҳи алайҳ","biography":{"years":"Аниқ йиллар келтирилмаган","places":"Марғилон, қадимий Зардармуш маҳалласи","evidence":"Китобдаги маҳаллий насабнома ва тарихий баён","bio":"Хожа Тоҳир раҳматуллоҳи алайҳ маҳаллий насабномада Хожа Ғиёсиддин раҳматуллоҳи алайҳнинг ўғиллари ва Хожа Шариф раҳматуллоҳи алайҳнинг оталари сифатида қайд этилганлар. Китоб бу авлодни Марғилоннинг қадимий Зардармуш маҳалласи билан боғлайди.","sources":[{"title":"Н. Абдулаҳатов, С. Аброров, А. Тошқулов — «Сармозор зиёратгоҳи», 103–104 ва 122-бетлар (BAYOZ, 2014)","url":"https://www.ziyouz.com/books/tarixiy/Nodirbek%20Abdulahatov%20va%20b.%20Sarmozor%20ziyoratgohi.pdf"}]}}],"gap":false,"parent":"p21","branch":"main","display_name":"Хожа Ғиёсиддин раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p20","branch":"main","display_name":"Хожа Нурмуҳаммад раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p19","branch":"main","display_name":"Мавлоно Муҳаммад Поянда раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p18","branch":"main","display_name":"Мавлоно Мусо раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p17","branch":"main","display_name":"Мавлоно Мир Боқи раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p16","branch":"main","display_name":"Хожа Абдурашид раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p15","branch":"main","display_name":"Хожа Абдураҳмон раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p14","branch":"main","display_name":"Хожа Мир Султон раҳматуллоҳи алайҳ"}],"gap":false,"parent":"p13","branch":"main","display_name":"Мир Саййид Ҳисомиддин (Ми , у зот оталарининг ҳаётлик даврида ёш вафот этган ва Муҳаммад, Али ҳамда Фотима исмли фарзандлар қолдирган.","sources":[{"title":"Имом Заҳабий — Сияр аълом ан-нубало: Жаъфар ибн Муҳаммад ва авлоди","url":"https://islamweb.net/ar/library/content/60/1048/%D8%AC%D8%B9%D9%81%D8%B1-%D8%A8%D9%86-%D9%85%D8%AD%D9%85%D8%AF"}]}}],"gap":false,"parent":"p5","branch":"main","display_name":"Ҳазрати Жаъфар Содиқ раҳматуллоҳи алайҳ","biography":{"years":"80–148 ҳ. (тахм. 699/700–765)","places":"Мадина","bio":"Ҳазрати Жаъфар Содиқ раҳматуллоҳи алайҳ — ҳазрати Муҳаммад Боқир раҳматуллоҳи алайҳнинг ўғиллари, Мадинанинг машҳур муҳаддис ва фақиҳларидан. Имом Абу Ҳанифа раҳматуллоҳи алайҳ у зотнинг илмини юксак баҳолаган; ҳадис уламолари ҳам у зотни ишончли ровий деб тан олганлар.","sources":[{"title":"Имом Заҳабий — Сияр аълом ан-нубало: Жаъфар ибн Муҳаммад","url":"https://islamweb.net/ar/library/content/60/1048/%D8%AC%D8%B9%D9%81%D8%B1-%D8%A8%D9%86-%D9%85%D8%AD%D9%85%D8%AF"}]}}],"gap":false,"parent":"p4","branch":"main","display_name":"Ҳазрати Муҳаммад Боқир раҳматуллоҳи алайҳ","biography":{"years":"56–114 ҳ. (тахм. 676–732)","places":"Мадина","bio":"Ҳазрати Муҳаммад Боқир раҳматуллоҳи алайҳ — ҳазрати Али Зайн ал-Обиддин раҳматуллоҳи алайҳнинг ўғиллари, Мадинанинг улуғ тобеин олимларидан. Имом Заҳабий у зотни илм ва амални жамлаган, ишончли фақиҳ ва муҳаддис сифатида таърифлайди.","sources":[{"title":"Имом Заҳабий — Сияр аълом ан-нубало: Муҳаммад Боқир","url":"https://islamweb.net/ar/library/content/60/608/%D8%A3%D8%A8%D9%88-%D8%AC%D8%B9%D9%81%D8%B1-%D8%A7%D9%84%D8%A8%D8%A7%D9%82%D8%B1"}]}}],"gap":false,"parent":"p3","branch":"main","display_name":"Ҳазрати Али Зайн ал-Обиддин раҳматуллоҳи алайҳ","biography":{"years":"38–94 ҳ. (тахм. 658–713)","places":"Мадина; Карбало ва Дамашқ","bio":"Ҳазрати Али Зайн ал-Обиддин раҳматуллоҳи алайҳ — ҳазрати Имом Ҳусайн розияллоҳу анҳунинг ўғиллари. Карбало куни бетоб бўлганлари учун жанг қилмаганлар ва кейин Мадинага қайтганлар. Имом Заҳабий у зотни илм, тақво ва фазилат соҳиби сифатида зикр қилади.","sources":[{"title":"Имом Заҳабий — Сияр аълом ан-нубало: Али ибн Ҳусайн","url":"https://islamweb.net/ar/library/content/60/607/%D8%B9%D9%84%D9%8A-%D8%A8%D9%86-%D8%A7%D9%84%D8%AD%D8%B3%D9%8A%D9%86"}]}}],"gap":false,"parent":"p2","branch":"main","display_name":"Ҳазрати Имом Ҳусайн розияллоҳу анҳу","biography":{"years":"4–61 ҳ. (тахм. 626–680)","places":"Мадина, Макка ва Карбало","bio":"Ҳазрати Имом Ҳусайн розияллоҳу анҳу — ҳазрати Али ва ҳазрати Фотима розияллоҳу анҳумонинг ўғиллари, Пайғамбаримиз Муҳаммад ﷺ (соллаллоҳу алайҳи васаллам)нинг севимли набираларидир. 61 ҳижрий йилда Карбало воқеасида аҳли ва тарафдорлари билан шаҳид бўлганлар.","sources":[{"title":"Миср Дорул-ифтоси — Ҳазрати Имом Ҳусайнга ҳурмат","url":"https://family.dar-alifta.org/fatwa/details/18245/%D8%AD%D9%83%D9%85-%D9%82%D9%88%D9%84-%D8%B3%D9%8A%D8%AF%D9%86%D8%A7-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%A5%D9%85%D8%A7%D9%85-%D8%A7%D9%84%D8%AD%D8%B3%D9%8A%D9%86-%D8%B9%D9%84%D9%8A%D9%87-%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85"},{"title":"Encyclopaedia Britannica — al-Husayn ibn Ali","url":"https://www.britannica.com/biography/al-Husayn-ibn-Ali-Muslim-leader-and-martyr"}]}}],"gap":false,"parent":"p1","branch":"main","display_name":"Ҳазрати Фотима розияллоҳу анҳо + Ҳазрати Али ибн Абу Толиб розияллоҳу анҳу","biography":{"years":"Ҳазрати Фотима розияллоҳу анҳо: ваф. 11 ҳ./632; Ҳазрати Али розияллоҳу анҳу: тахм. 600–40 ҳ./661","places":"Макка ва Мадина; Ҳазрати Али розияллоҳу анҳу — Куфа","bio":"Ҳазрати Фотима розияллоҳу анҳо — Пайғамбаримиз Муҳаммад ﷺ (соллаллоҳу алайҳи васаллам) ва ҳазрати Хадича розияллоҳу анҳонинг қизлари, жаннат аёлларининг улуғларидан. Ҳазрати Али ибн Абу Толиб розияллоҳу анҳу — Пайғамбаримиз Муҳаммад ﷺ (соллаллоҳу алайҳи васаллам)нинг амакиваччалари ва куёвлари, илк мусулмонлардан ҳамда тўртинчи рошид халифадирлар.","sources":[{"title":"Миср Дорул-ифтоси — Саййида Фотима аз-Заҳро розияллоҳу анҳо","url":"https://www.dar-alifta.org/ar/ourreligion/details/4399/%D8%A7%D9%84%D8%B3%D9%8A%D8%AF%D8%A9-%D9%81%D8%A7%D8%B7%D9%85%D8%A9-%D8%A7%D9%84%D8%B2%D9%87%D8%B1%D8%A7%D8%A1"},{"title":"Миср Дорул-ифтоси — Али ибн Абу Толиб розияллоҳу анҳу","url":"https://dar-alifta.org/ar/articles/details/7495/%D8%B9%D9%84%D9%8A-%D8%A8%D9%86-%D8%A7%D8%A8%D9%8A-%D8%B7%D8%A7%D9%84%D8%A8"}]}}],"gap":false,"parent":null,"branch":"main","display_name":"Пайғамбаримиз Муҳаммад ﷺ (соллаллоҳу алайҳи васаллам)","biography":{"years":"тахм. 570–632","places":"Макка ва Мадина","bio":"Пайғамбаримиз Муҳаммад ﷺ (соллаллоҳу алайҳи васаллам) тахминан 570 йилда Маккада туғилганлар. Қирқ ёшларида илк ваҳийни олганлар, Маккадан Мадинага ҳижрат қилганлар ва 632 йилда Мадинада вафот этганлар.","sources":[{"title":"Миср Дорул-ифтоси — Пайғамбаринг ким?","url":"https://www.dar-alifta.org/ar/articles/details/4139/%D9%85%D9%86-%D9%87%D9%88-%D9%86%D8%A8%D9%8A%D9%83%D8%9F"},{"title":"The Metropolitan Museum of Art — The Birth of Islam","url":"https://www.metmuseum.org/ja/essays/the-birth-of-islam"}]}}],"branches":[{"id":"p29","label":"Мирҳамид (Марғилонда)"},{"id":"p76","label":"Мирсаййид Ориф"},{"id":"p148","label":"Мирсаййид Мавлоно (Ғор эшон)"},{"id":"p227","label":"Халфаи Сафо (Қўқонда)"},{"id":"p245","label":"Мадали Махсум"},{"id":"p308","label":"Мирсаййид Сафоаҳмад"}]};
const byId=new Map(),parents=new Map();
function walk(node,parent=null){byId.set(node.id,node);parents.set(node.id,parent);node.children.forEach(c=>walk(c,node))}DATA.roots.forEach(r=>walk(r));
const branchIds=new Set(DATA.branches.map(b=>b.id));
const people=[...byId.values()].filter(n=>!n.gap),leaves=people.filter(n=>!n.children.length);
const biographies=people.filter(n=>n.biography);
document.getElementById('personCount').textContent=`${byId.size} боғланган ёзув`;
document.getElementById('leafCount').textContent=`${leaves.length} сўнгги авлод`;
document.getElementById('bioCount').textContent=`${biographies.length} манбали маълумот`;
let current=DATA.roots[0],mode='nav',query='';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const regexEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm=s=>s.toLocaleLowerCase('uz-Cyrl').replace(/ё/g,'е').replace(/ў/g,'у').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ҳ/g,'х').replace(/жон(?=$|[\s,().-])/g,'хон').replace(/[’'`ʻ]/g,'').replace(/\s+/g,' ').trim();
const nameOf=n=>n.display_name||n.label;
const ancestry=n=>{const out=[];while(n){out.unshift(n);n=parents.get(n.id)}return out};
function renderBio(n){const b=n.biography;if(!b)return '';const evidence=b.evidence?`<div class="bio-fact"><strong>Маълумот хусусияти:</strong> ${esc(b.evidence)}</div>`:'';const lineage=b.lineage?`<section class="lineage-record" aria-label="Маҳаллий насабнома қайди"><h3>${esc(b.lineage.title)}</h3><p>${esc(b.lineage.text)}</p><div class="lineage-chain">${b.lineage.chain.map(x=>`<span class="lineage-person">${esc(x)}</span>`).join('')}</div><p class="lineage-note">${esc(b.lineage.note)}</p></section>`:'';return `<section class="bio" aria-label="Манбали маълумот"><div class="bio-facts"><div class="bio-fact"><strong>Йиллар:</strong> ${esc(b.years)}</div><div class="bio-fact"><strong>Яшаган жойлари:</strong> ${esc(b.places)}</div>${evidence}</div><p>${esc(b.bio)}</p>${lineage}<div class="sources" aria-label="Манбалар">${b.sources.map((s,i)=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Манба ${i+1}: ${esc(s.title)}</a>`).join('')}</div></section>`}
function select(id){current=byId.get(id);renderNavigator();if(mode==='tree'){mode='nav';setMode()}window.scrollTo({top:Math.max(0,document.getElementById('navigator').offsetTop-88),behavior:'smooth'})}
function personRow(n,i){return `<button class="person-btn" data-id="${n.id}"><span class="child-index">${n.gap?'…':i+1}</span><span class="child-name">${esc(n.gap?'Аниқланмаган бўғин(лар)':nameOf(n))}${n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':''}</span><span class="next-pill">${n.children.length?'ДАВОМИ':'›'}</span></button>`}
function renderLineage(path,generation){const real=path.filter(n=>!n.gap),first=real[0],last=real[real.length-1];let number=0;const mini=generation===1?`<span class="lineage-mini-name">${esc(nameOf(last))}</span>`:`<span class="lineage-mini-name">${esc(nameOf(first))}</span><span class="lineage-mini-gap">${generation>2?`+${generation-2}`:'→'}</span><span class="lineage-mini-name">${esc(nameOf(last))}</span>`;const items=path.map(n=>{const label=n.gap?'Аниқланмаган бўғин(лар)':nameOf(n),num=n.gap?'…':++number;return `<button class="lineage-step ${n.gap?'gap ':''}${n===current?'current':''}" data-id="${n.id}"><span class="lineage-number">${num}</span><span class="lineage-step-name">${esc(label)}</span></button>`}).join('');return `<button class="lineage-open" type="button" aria-haspopup="dialog"><span class="lineage-summary-copy"><span class="lineage-kicker">НАСАБ ЙЎЛИ · ${generation} АВЛОД</span><span class="lineage-mini">${mini}</span></span><span class="lineage-view">ТЎЛИҚ КЎРИШ</span></button><dialog class="lineage-dialog" aria-label="Тўлиқ насаб йўли"><div class="lineage-shell"><header class="lineage-head"><div class="lineage-head-copy"><span class="lineage-head-label">АЖДОДЛАРДАН ҲОЗИРГИ АВЛОДГАЧА</span><h3>Насаб йўли · ${generation} авлод</h3></div><button class="lineage-close" type="button" aria-label="Ёпиш">×</button></header><div class="lineage-list">${items}</div></div></dialog>`}
function renderNavigator(){const nav=document.getElementById('navigator'),parent=parents.get(current.id),path=ancestry(current),siblings=parent?parent.children.filter(n=>n!==current&&!n.gap):[],generation=path.filter(n=>!n.gap).length,branchClass=`branch-${current.branch||'main'}`;nav.innerHTML=`${renderLineage(path,generation)}<article class="card ${branchClass}"><header class="person-head"><div class="person-head-copy"><div class="meta">${current.gap?'АНИҚЛАНМАГАН БЎҒИН':`АВЛОД ДАРАЖАСИ · ${generation}`}</div><h2 class="person-name">${esc(nameOf(current).replace(/^\[|\]$/g,''))}</h2></div>${current.children.length?`<span class="child-count">${current.children.length} ФАРЗАНД</span>`:''}</header>${renderBio(current)}${current.children.length?`<div class="section-title">Фарзандлари · ${current.children.length}</div><div class="people">${current.children.map(personRow).join('')}</div>`:'<div class="empty-state">Манбада фарзандлар кўрсатилмаган.</div>'}${siblings.length?`<div class="section-title">Ака-ука ва опа-сингиллари</div><div class="people">${siblings.map(personRow).join('')}</div>`:''}<div class="nav-actions">${parent?`<button class="btn secondary" data-id="${parent.id}">← Ота-онасига чиқиш</button>`:''}<button class="btn secondary" data-id="${DATA.roots[0].id}">Бошига қайтиш</button></div></article>`;const dialog=nav.querySelector('.lineage-dialog');nav.querySelector('.lineage-open').onclick=()=>dialog.showModal();nav.querySelector('.lineage-close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};nav.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>select(x.dataset.id))}
function renderTree(){const root=document.getElementById('tree');function item(n,depth=0){const has=n.children.length;return `<li class="node branch-${n.branch||'main'} ${n.gap?'gap ':''}${branchIds.has(n.id)?'branch ':''}" data-id="${n.id}"><div class="node-row"><button class="toggle ${has?'':'empty'}" ${has?'':'disabled'} aria-label="${has?'Тармоқни очиш ёки ёпиш':''}">${has?'−':'·'}</button><button class="node-name">${esc(nameOf(n).replace(/^\[|\]$/g,''))}${n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':''}</button></div>${has?`<ul>${n.children.map(c=>item(c,depth+1)).join('')}</ul>`:''}</li>`}root.innerHTML=`<ul>${DATA.roots.map(r=>item(r)).join('')}</ul>`;root.querySelectorAll('.toggle:not(.empty)').forEach(btn=>btn.onclick=()=>{const li=btn.closest('.node');li.classList.toggle('collapsed');btn.textContent=li.classList.contains('collapsed')?'+':'−'});root.querySelectorAll('.node-name').forEach(btn=>btn.onclick=()=>select(btn.closest('.node').dataset.id))}
function setMode(){const nav=mode==='nav';document.getElementById('navigator').hidden=!nav;document.getElementById('hierarchy').hidden=nav;document.getElementById('navMode').setAttribute('aria-pressed',String(nav));document.getElementById('treeMode').setAttribute('aria-pressed',String(!nav));if(!nav&&!document.getElementById('tree').children.length)renderTree()}
document.getElementById('navMode').onclick=()=>{mode='nav';setMode()};document.getElementById('treeMode').onclick=()=>{mode='tree';setMode()};
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.node').forEach(li=>{li.classList.remove('collapsed');const b=li.querySelector(':scope>.node-row>.toggle');if(b&&!b.classList.contains('empty'))b.textContent='−'});
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.node').forEach((li,i)=>{if(i){li.classList.add('collapsed');const b=li.querySelector(':scope>.node-row>.toggle');if(b&&!b.classList.contains('empty'))b.textContent='+'}});
function searchable(n){return [n.label,nameOf(n),n.biography?.bio,n.biography?.years,n.biography?.places].filter(Boolean).join(' ')}
const personMatches=(n,q)=>norm(searchable(n)).includes(q);
const nameScore=(n,q)=>{const name=norm(nameOf(n));if(name.startsWith(q))return 0;if(name.split(' ').some(w=>w.startsWith(q)))return 1;if(name.includes(q))return 2;return 9};
function highlightedName(n,value){const name=nameOf(n),lower=name.toLocaleLowerCase('uz-Cyrl'),q=value.toLocaleLowerCase('uz-Cyrl'),at=lower.indexOf(q);return at<0?`<mark>${esc(name)}</mark>`:`${esc(name.slice(0,at))}<mark>${esc(name.slice(at,at+value.length))}</mark>${esc(name.slice(at+value.length))}`}
function renderSuggestions(value){const box=document.getElementById('suggestions'),input=document.getElementById('search'),q=norm(value);if(!q){box.hidden=true;input.setAttribute('aria-expanded','false');return}const found=people.filter(n=>norm(nameOf(n)).includes(q)).sort((a,b)=>nameScore(a,q)-nameScore(b,q)||nameOf(a).localeCompare(nameOf(b),'uz-Cyrl')).slice(0,8);box.innerHTML=found.length?found.map(n=>{const p=parents.get(n.id);return `<button class="suggestion-btn" type="button" role="option" data-id="${n.id}"><span class="suggestion-name">${esc(nameOf(n))}</span><span class="suggestion-path">${p?`Ота-онаси: ${esc(nameOf(p))}`:'Шажара боши'}</span></button>`}).join(''):'<div class="suggestion-empty">Ҳозирча мос исм топилмади.</div>';box.hidden=false;input.setAttribute('aria-expanded','true');box.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const n=byId.get(btn.dataset.id);input.value=nameOf(n);box.hidden=true;input.setAttribute('aria-expanded','false');document.getElementById('clearSearch').hidden=false;select(n.id)})}
function searchTree(value){query=value.trim();const clear=document.getElementById('clearSearch');clear.hidden=!query;if(!query)return;mode='tree';setMode();const q=norm(query),nodes=[...document.querySelectorAll('.node')];nodes.forEach(li=>li.classList.remove('hidden-by-search'));let matches=0;nodes.forEach(li=>{const n=byId.get(li.dataset.id),self=personMatches(n,q),desc=[...li.querySelectorAll(':scope .node')].some(x=>personMatches(byId.get(x.dataset.id),q));if(!self&&!desc)li.classList.add('hidden-by-search');if(self){matches++;li.querySelector('.node-name').innerHTML=highlightedName(n,query)+(n.biography?'<span class="bio-badge">МАЪЛУМОТ</span>':'');ancestry(n).forEach(a=>{const x=document.querySelector(`.node[data-id="${a.id}"]`);x?.classList.remove('collapsed');const b=x?.querySelector(':scope>.node-row>.toggle');if(b&&!b.classList.contains('empty'))b.textContent='−'})}});if(!matches)document.getElementById('tree').insertAdjacentHTML('afterbegin','<div class="empty-state" id="noResults">Мос исм ёки маълумот топилмади.</div>')}
const searchInput=document.getElementById('search');
searchInput.oninput=e=>{document.getElementById('noResults')?.remove();renderSuggestions(e.target.value);if(!e.target.value){query='';document.getElementById('clearSearch').hidden=true;if(document.getElementById('tree').children.length)renderTree();return}renderTree();searchTree(e.target.value)};
searchInput.onkeydown=e=>{const options=[...document.querySelectorAll('.suggestion-btn')];if(e.key==='Escape'){document.getElementById('suggestions').hidden=true;searchInput.setAttribute('aria-expanded','false');return}if(!options.length)return;let active=options.findIndex(x=>x.classList.contains('active'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();options.forEach(x=>x.classList.remove('active'));active=e.key==='ArrowDown'?(active+1)%options.length:(active-1+options.length)%options.length;options[active].classList.add('active');options[active].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();(active>=0?options[active]:options[0]).click()}};
searchInput.onfocus=()=>{if(searchInput.value)renderSuggestions(searchInput.value)};
document.addEventListener('click',e=>{if(!e.target.closest('.search-field')){document.getElementById('suggestions').hidden=true;searchInput.setAttribute('aria-expanded','false')}});
document.getElementById('clearSearch').onclick=()=>{searchInput.value='';searchInput.dispatchEvent(new Event('input'));searchInput.focus()};
renderNavigator();
</script>
</body></html>
